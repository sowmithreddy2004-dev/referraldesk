apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: referraldesk
spec:
  replicas: 2
  selector:
    matchLabels: {app: frontend}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: {app: frontend}
      containers:
      - name: frontend
        image: us-central1-docker.pkg.dev/ee-vivekvardhan43862/referraldesk-repo/frontend:v1
        ports: [{containerPort: 80}]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 10
          periodSeconds: 15
        lifecycle:
          preStop:
            exec: {command: ["sleep", "5"]}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: referraldesk
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
