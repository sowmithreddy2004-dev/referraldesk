apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: referraldesk
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: backend}
    spec:
      serviceAccountName: referraldesk-app
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: {app: backend}
      containers:
      - name: backend
        image: us-central1-docker.pkg.dev/ee-vivekvardhan43862/referraldesk-repo/backend:v4
        ports: [{containerPort: 8000}]
        env:
        - {name: GCP_PROJECT, value: ee-vivekvardhan43862}
        - {name: DB_HOST, value: "10.37.0.3"}
        - {name: UPLOAD_BUCKET, value: ee-vivekvardhan43862-referraldesk-uploads}
        - {name: MOCK_EHR_URL, value: "http://mock-ehr:9000"}
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}
        # Readiness: can this pod serve real traffic? Checks the database.
        readinessProbe:
          httpGet: {path: /readyz, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        # Liveness: is the process alive? Checks nothing external.
        livenessProbe:
          httpGet: {path: /healthz, port: 8000}
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec: {command: ["sleep", "5"]}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: referraldesk
spec:
  selector: {app: backend}
  ports: [{port: 8000, targetPort: 8000}]
