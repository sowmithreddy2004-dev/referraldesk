apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-ehr
  namespace: referraldesk
spec:
  replicas: 2
  selector:
    matchLabels: {app: mock-ehr}
  template:
    metadata:
      labels: {app: mock-ehr}
    spec:
      containers:
      - name: mock-ehr
        image: us-central1-docker.pkg.dev/ee-vivekvardhan43862/referraldesk-repo/mock-ehr:v1
        ports: [{containerPort: 9000}]
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 128Mi}
        readinessProbe:
          tcpSocket: {port: 9000}
          periodSeconds: 10
        livenessProbe:
          tcpSocket: {port: 9000}
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: mock-ehr
  namespace: referraldesk
spec:
  selector: {app: mock-ehr}
  ports: [{port: 9000, targetPort: 9000}]
