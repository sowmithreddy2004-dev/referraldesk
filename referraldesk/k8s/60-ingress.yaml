apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: referraldesk-cert
  namespace: referraldesk
spec:
  domains:
  - 8-233-65-8.sslip.io
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: referraldesk-frontend-config
  namespace: referraldesk
spec:
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: referraldesk
  namespace: referraldesk
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: referraldesk-ip
    networking.gke.io/managed-certificates: referraldesk-cert
    networking.gke.io/v1beta1.FrontendConfig: referraldesk-frontend-config
spec:
  rules:
  - host: 8-233-65-8.sslip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
